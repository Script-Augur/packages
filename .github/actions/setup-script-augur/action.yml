name: Setup Script-Augur
description: Setup Node, pnpm, and GitHub Packages auth for @script-augur installs
inputs:
  node-version:
    description: Node.js version
    required: false
    default: '22'
  pnpm-version:
    description: pnpm version
    required: false
    default: '9.9.0'
runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        registry-url: https://npm.pkg.github.com
        scope: '@script-augur'

    - name: Export package auth env
      shell: bash
      run: |
        if [ -z "${NPM_TOKEN:-}" ] && [ -n "${NODE_AUTH_TOKEN:-}" ]; then
          echo "NPM_TOKEN=${NODE_AUTH_TOKEN}" >> "$GITHUB_ENV"
        fi
        if [ -z "${NODE_AUTH_TOKEN:-}" ] && [ -n "${NPM_TOKEN:-}" ]; then
          echo "NODE_AUTH_TOKEN=${NPM_TOKEN}" >> "$GITHUB_ENV"
        fi
        if [ -z "${NPM_TOKEN:-}" ] && [ -z "${NODE_AUTH_TOKEN:-}" ] && [ -n "${GITHUB_TOKEN:-}" ]; then
          echo "NPM_TOKEN=${GITHUB_TOKEN}" >> "$GITHUB_ENV"
          echo "NODE_AUTH_TOKEN=${GITHUB_TOKEN}" >> "$GITHUB_ENV"
        fi
