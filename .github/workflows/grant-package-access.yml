name: Grant package access

on:
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  publish-public:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-script-augur
        with:
          cache: 'true'
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - name: Publish packages as public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          for pkg in packages/*/package.json; do
            dir=$(dirname "$pkg")
            name=$(node -p "require('./$pkg').name")
            echo "Publishing $name from $dir (public)..."
            (cd "$dir" && pnpm publish --no-git-checks --access public)
          done
          exit 0
      - name: Set package visibility public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for pkg in tsconfig prettier-config eslint-config eslint-plugin-module-ordering vite-plugin-image-gen vite-plugin-svg-sprite; do
            echo "Visibility for $pkg:"
            gh api -X POST "orgs/Script-Augur/packages/npm/$pkg/visibility" \
              -f visibility=public || \
            gh api --method PUT "user/packages/npm/$pkg/visibility" \
              -f visibility=public || true
            gh api "orgs/Script-Augur/packages/npm/$pkg" --jq '{name,visibility}' || true
          done
